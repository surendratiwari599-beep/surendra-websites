<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDS Secure Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:16px system-ui,Arial}header{background:#10213a;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:28px auto;padding:0 16px}.box{background:#fff;padding:22px;border-radius:16px;margin:18px 0;box-shadow:0 8px 25px #00000008}.login{max-width:440px;margin:9vh auto}.field{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;margin:7px 0 14px;font:inherit}.btn{padding:11px 16px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}.secondary{background:#475569}.danger{background:#dc2626}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#eff6ff;padding:18px;border-radius:12px}.card strong{display:block;font-size:28px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0;font-size:14px}.muted{color:#64748b;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}@media(max-width:650px){.cards{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head>
<body><header><strong>Surendra Digital Solutions | Secure Admin</strong><button id="logout" class="btn secondary hidden">Sign out</button></header><main>
<section id="login" class="box login"><h2>Admin Sign in</h2><p class="muted">Secure sign-in uses Supabase Authentication. There is no shared hard-coded password.</p><label>Email</label><input class="field" id="email" type="email" autocomplete="username"><label>Password</label><input class="field" id="password" type="password" autocomplete="current-password"><button class="btn" id="signin">Sign in</button><p id="msg"></p></section>
<section id="app" class="hidden"><div class="box"><div class="top"><h2>Dashboard</h2><button class="btn secondary" id="export">Export CSV</button></div><div class="cards"><div class="card">Total leads<strong id="total">0</strong></div><div class="card">Interested / converted<strong id="hot">0</strong></div><div class="card">Follow-up<strong id="follow">0</strong></div></div></div>
<div class="box"><h2>Add lead</h2><div class="row"><input id="name" class="field" placeholder="Name/business (required)"><input id="phone" class="field" placeholder="Phone"><input id="leademail" class="field" placeholder="Email"></div><div class="row"><select id="status" class="field"><option>New</option><option>Interested</option><option>Follow-up</option><option>Converted</option><option>Not Interested</option></select><input id="source" class="field" placeholder="Lead source"></div><textarea id="notes" class="field" placeholder="Notes" rows="3"></textarea><button class="btn" id="add">Save lead</button><p id="addmsg"></p></div>
<div class="box"><h2>Lead records</h2><div id="records"></div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const loginBox=document.getElementById('login'),app=document.getElementById('app'),logoutBtn=document.getElementById('logout'),msg=document.getElementById('msg');
let db=null,leads=[];
function configured(){return window.SDS_SUPABASE_URL&&window.SDS_SUPABASE_ANON_KEY&&!window.SDS_SUPABASE_URL.includes('YOUR_')&&!window.SDS_SUPABASE_ANON_KEY.includes('YOUR_')}
if(!configured()){msg.textContent='Setup needed: configure supabase-config.js and apply setup.sql. See ADMIN_SETUP.md.';document.getElementById('signin').disabled=true;}
else db=window.supabase.createClient(window.SDS_SUPABASE_URL,window.SDS_SUPABASE_ANON_KEY);
async function sessionCheck(){if(!db)return;let {data}=await db.auth.getSession();if(data.session)showApp();else showLogin()}
function showLogin(){loginBox.classList.remove('hidden');app.classList.add('hidden');logoutBtn.classList.add('hidden')}
async function showApp(){loginBox.classList.add('hidden');app.classList.remove('hidden');logoutBtn.classList.remove('hidden');await loadLeads()}
document.getElementById('signin').onclick=async()=>{msg.textContent='';let {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)msg.textContent=error.message;else await showApp()};
logoutBtn.onclick=async()=>{await db.auth.signOut();showLogin()};
async function loadLeads(){let {data,error}=await db.from('leads').select('*').order('created_at',{ascending:false});if(error){document.getElementById('records').textContent=error.message;return}leads=data||[];render()}
function render(){document.getElementById('total').textContent=leads.length;document.getElementById('hot').textContent=leads.filter(x=>['Interested','Converted'].includes(x.status)).length;document.getElementById('follow').textContent=leads.filter(x=>x.status==='Follow-up').length;let html=leads.length?'<table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Status</th><th>Source</th><th>Notes</th><th></th></tr></thead><tbody>'+leads.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.email)+'</td><td><select onchange="updateStatus(\''+x.id+'\',this.value)">'+['New','Interested','Follow-up','Converted','Not Interested'].map(s=>'<option '+(s===x.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td>'+esc(x.source)+'</td><td>'+esc(x.notes)+'</td><td><button class="btn danger" onclick="del(\''+x.id+'\')">Delete</button></td></tr>').join('')+'</tbody></table>':'<p>No leads yet.</p>';document.getElementById('records').innerHTML=html}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('add').onclick=async()=>{let n=document.getElementById('name').value.trim();if(!n){document.getElementById('addmsg').textContent='Name is required';return}let payload={name:n,phone:phone.value,email:leademail.value,status:status.value,source:source.value,notes:notes.value};let {error}=await db.from('leads').insert(payload);document.getElementById('addmsg').textContent=error?error.message:'Lead saved';if(!error){['name','phone','leademail','source','notes'].forEach(id=>document.getElementById(id).value='');await loadLeads()}};
window.updateStatus=async(id,s)=>{let {error}=await db.from('leads').update({status:s}).eq('id',id);if(error)alert(error.message);else loadLeads()};
window.del=async(id)=>{if(!confirm('Delete this record?'))return;let {error}=await db.from('leads').delete().eq('id',id);if(error)alert(error.message);else loadLeads()};
document.getElementById('export').onclick=()=>{let keys=['name','phone','email','status','source','notes'],csv=keys.join(',')+'\n'+leads.map(x=>keys.map(k=>'"'+String(x[k]||'').replace(/"/g,'""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sds-leads.csv';a.click()};
sessionCheck();
</script></body></html>
